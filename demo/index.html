<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security: no network access, no external scripts, no forms. Everything runs locally on synthetic data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Personal Kate: the right guidance for every KBC customer (demo)</title>
<style>
:root{
  --kbc:#3DB4EA; --fab:#2196E0; --link:#38A8E8;
  --bg:#0E0E10; --card:#1C1C1F; --card-2:#26262A; --hair:#2C2C31;
  --txt:#F5F5F7; --muted:#A1A1A8; --ok:#34C27A; --warn:#F0A04B;
  --sans: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s:1; --s4:.8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:radial-gradient(1100px 700px at 62% 45%,rgba(61,180,234,.14),transparent 62%),#08090B;color:#fff;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:inherit}
button:focus-visible{outline:2px solid var(--kbc);outline-offset:2px}

/* ---------- Demo controls (press H to hide before recording) ---------- */
#controls{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:4px;padding:0 14px;background:rgba(4,5,7,.9);border-bottom:1px solid rgba(255,255,255,.08);z-index:50;font-size:13px;white-space:nowrap;overflow-x:auto}
body.no-controls #controls{display:none}
.ctl-group{display:flex;gap:4px;align-items:center;margin-right:12px}
.ctl-label{color:#8E8E96;margin-right:4px}
.ctl{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.07);color:#E0E0E6}
.ctl[aria-pressed="true"]{background:var(--kbc);color:#04263A;font-weight:600}
.ctl-hint{margin-left:auto;color:#6E6E78;padding-left:12px}

/* ---------- Stage & scenes ---------- */
#stage{position:absolute;left:0;right:0;bottom:0;top:52px}
body.no-controls #stage{top:0}
.scene{position:absolute;inset:0;display:none}
.scene.active{display:flex}

#scene-intro{align-items:center;padding:0 9vw}
.big{font-size:clamp(44px,6vw,92px);line-height:1.02;font-weight:700;letter-spacing:-.03em;max-width:15ch}
.sub{margin-top:28px;font-size:clamp(18px,1.7vw,24px);line-height:1.5;color:#C7C7CF;max-width:44ch}
.team{margin-top:44px;color:#7C7C86;font-size:15px}

/* ---------- Phone shell ---------- */
.phone{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--bg);color:var(--txt);
  box-shadow:0 0 0 11px #040405,0 0 0 12px #3A3A40,0 40px 90px rgba(0,0,0,.6);transform-origin:top left;--fs:1}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:34px;border-radius:20px;background:#000;z-index:40}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 40px;font-size:16px;font-weight:650;z-index:12;color:#fff}
.status svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff;z-index:30;opacity:.9}

/* ---------- Scene 2: lock screens ---------- */
#scene-lock{align-items:center;justify-content:center;padding:0 3vw}
.lock-col{display:flex;flex-direction:column;align-items:center;gap:22px}
.lock-wrap{width:calc(390px * var(--s4));height:calc(844px * var(--s4))}
.lock-wrap .phone{transform:scale(var(--s4))}
.lock-label{text-align:center;width:calc(390px * var(--s4));min-width:220px}
.lock-label b{display:block;font-size:20px;font-weight:650}
.lock-label .ll-sub{display:block;color:#9A9AA4;font-size:14px;margin-top:5px;line-height:1.4}
.lock-row{display:flex;gap:36px;align-items:flex-start}
.lock{background:var(--wall)}
.wall-lotte{--wall:radial-gradient(90% 55% at 22% 28%,#E27D8E 0%,transparent 70%),radial-gradient(80% 60% at 88% 72%,#E9A55B 0%,transparent 68%),linear-gradient(180deg,#43293F,#161015)}
.wall-ahmed{--wall:radial-gradient(90% 55% at 25% 25%,#5E9C7A 0%,transparent 70%),radial-gradient(80% 60% at 85% 75%,#2F6E73 0%,transparent 70%),linear-gradient(180deg,#1F3A33,#0E1614)}
.wall-marc{--wall:radial-gradient(90% 55% at 25% 25%,#5A7EA6 0%,transparent 70%),radial-gradient(80% 60% at 85% 75%,#2D4460 0%,transparent 70%),linear-gradient(180deg,#1E2A3A,#0C1118)}
.wall-anna{--wall:radial-gradient(90% 55% at 25% 25%,#9C8AD0 0%,transparent 70%),radial-gradient(80% 60% at 85% 75%,#C98FB5 0%,transparent 68%),linear-gradient(180deg,#2E2745,#120F1A)}
.lock-date{position:absolute;top:92px;left:0;right:0;text-align:center;font-size:21px;font-weight:600;color:rgba(255,255,255,.88)}
.lock-time{position:absolute;top:112px;left:0;right:0;text-align:center;font-size:98px;font-weight:650;letter-spacing:-2px;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
.notif{position:absolute;left:12px;right:12px;bottom:132px;display:flex;gap:12px;align-items:flex-start;padding:13px 14px 14px;border-radius:24px;
  background:rgba(58,58,62,.6);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);color:#fff;
  opacity:0;transform:translateY(26px) scale(.97);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.2,1)}
.notif.show{opacity:1;transform:none}
.notif:hover{background:rgba(72,72,78,.66)}
.app-ico{width:40px;height:40px;border-radius:10px;background:linear-gradient(160deg,#66CCF5,#2FA7E4);display:grid;place-items:center;flex:0 0 40px;margin-top:2px}
.n-main{flex:1;min-width:0}
.n-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.n-title{font-weight:650;font-size:16px}
.n-time{color:rgba(235,235,245,.6);font-size:14px}
.n-body{font-size:15px;line-height:1.3;margin-top:1px}
.lk-btn{position:absolute;bottom:48px;width:50px;height:50px;border-radius:50%;background:rgba(30,30,34,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff}

/* ---------- Scenes 3 and 4: the app ---------- */
#scene-app{align-items:center;justify-content:center;gap:5.5vw;padding:0 4vw}
.caption{flex:0 0 330px;color:#E0E0E6}
.cap-step{color:#8E8E96;font-size:15px}
.cap-name{font-size:46px;line-height:1.05;margin-top:6px;font-weight:700;letter-spacing:-.02em;color:#fff}
.cap-meta{margin-top:10px;color:#A9A9B2;font-size:16px;line-height:1.4}
.cap-dl{margin-top:30px;display:grid;grid-template-columns:100px 1fr;row-gap:14px;column-gap:14px;font-size:15px;line-height:1.35}
.cap-dl dt{color:#8E8E96}
.cap-dl dd{color:#fff;font-weight:600}
.cap-dl dd small{display:block;font-weight:400;color:#A9A9B2;font-size:13px;margin-top:2px}
.cap-event{margin-top:28px;display:inline-block;padding:9px 12px;border-radius:10px;background:rgba(61,180,234,.15);color:#BDE6FA;font-size:14px;line-height:1.4}

.app-wrap{flex:0 0 auto;width:calc(390px * var(--s));height:calc(844px * var(--s))}
#app-phone{transform:scale(var(--s))}
#app-phone[data-size=large]{--fs:1.1}
.status.solid{background:var(--bg)}
.screen{position:absolute;inset:0;transition:transform .38s cubic-bezier(.2,.8,.2,1);background:var(--bg)}
.screen-rec{transform:translateX(100%);z-index:8}
#app-phone[data-screen=rec] .screen-rec{transform:none}
#app-phone[data-screen=rec] .screen-home{transform:translateX(-22%)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:58px 16px 130px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* home */
.k-top{display:flex;align-items:center;gap:8px;margin-top:8px}
.k-circ{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--hair);display:grid;place-items:center;flex:0 0 44px;position:relative;color:#fff}
.k-circ .red{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#FF453A}
.k-search{flex:1;min-width:0;height:44px;border-radius:22px;background:var(--card);border:1px solid var(--hair);display:flex;align-items:center;gap:7px;padding:0 11px;color:#D1D1D6;font-size:13.5px}
.k-search .ph{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kate-badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#fff;font-size:14.5px;flex:0 0 auto}
.kate-dot{width:18px;height:18px;border-radius:50%;background:linear-gradient(160deg,#6FD0F6,#2FA7E4);display:inline-grid;place-items:center;flex:0 0 18px}
.k-chips{display:flex;gap:8px;margin-top:18px}
.chip{height:38px;border-radius:19px;background:#1F2327;display:flex;align-items:center;gap:6px;padding:0 13px;font-size:15px;color:#E5E5EA}
.chip.on{background:#EDEDF0;color:#111;padding:0 13px}
.k-accts{display:flex;gap:10px;margin:18px -16px 0;padding:0 16px;overflow:hidden}
.acc{flex:0 0 150px;border-radius:16px;overflow:hidden;background:var(--card)}
.acc-top{height:108px;display:grid;place-items:center;color:#0F3B53;
  background:linear-gradient(128deg,rgba(255,255,255,.22) 0 30%,transparent 30%),linear-gradient(232deg,rgba(255,255,255,.14) 0 36%,transparent 36%),linear-gradient(160deg,#66CCF5,#36AEE7)}
.acc-bot{padding:10px 12px 12px}
.acc-name{font-size:calc(12.5px * var(--fs));color:var(--muted)}
.acc-amt{font-size:calc(15px * var(--fs));font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.show-pay{display:flex;align-items:center;gap:10px;color:var(--link);font-size:14px;font-weight:600;margin:16px 0 0 20px}
.k-sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.k-sec h2{font-size:calc(21px * var(--fs));font-weight:500}
.k-sec span{color:var(--link);font-size:14.5px;font-weight:650}
.k-card{position:relative;display:flex;gap:14px;width:100%;background:var(--card);border-radius:16px;padding:16px 40px 16px 16px;margin-bottom:12px;color:var(--txt)}
.k-card .ico{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;color:#fff}
.k-card .x{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;background:#2C2C31;display:grid;place-items:center;color:#A1A1A8;font-size:11px}
.k-txt{display:block;flex:1}
.k-txt p{font-size:calc(15.5px * var(--fs));line-height:1.4;color:#EDEDF0}
.k-lbl{display:flex;align-items:center;gap:6px;font-weight:700;font-size:calc(14px * var(--fs));margin-bottom:5px}
.k-card.kate{border:1px solid rgba(61,180,234,.6);cursor:pointer}
.k-card.kate:hover{background:#212125}
.k-title{display:block;font-weight:700;font-size:calc(16.5px * var(--fs));line-height:1.3}
.k-teaser{display:block;font-size:calc(15px * var(--fs));line-height:1.4;color:#D5D5DB;margin-top:4px}
.k-more{display:inline-flex;align-items:center;gap:4px;margin-top:10px;color:var(--link);font-weight:650;font-size:calc(14px * var(--fs))}
.k-card.pulse{animation:kpulse 1.7s ease 2}
@keyframes kpulse{0%{box-shadow:0 0 0 0 rgba(61,180,234,.75)}100%{box-shadow:0 0 0 16px rgba(61,180,234,0)}}
.fab{position:absolute;right:18px;bottom:110px;width:62px;height:62px;border-radius:50%;background:var(--fab);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.45);z-index:6}
.k-nav{position:absolute;left:14px;right:14px;bottom:26px;height:72px;border-radius:36px;background:rgba(34,34,38,.95);border:1px solid #34343A;display:flex;align-items:center;padding:0 6px;z-index:6}
.k-nav span{flex:1;height:60px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:#D1D1D6}
.k-nav span.on{background:#3A3A40;color:#fff}

/* recommendation screen */
.r-head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.r-back{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--hair);display:grid;place-items:center;flex:0 0 44px}
.r-head h1{font-size:18px;font-weight:650}
.r-hero{position:relative;height:150px;border-radius:20px;overflow:hidden;padding:14px;display:flex;align-items:flex-end;color:#0F3B53;
  background:linear-gradient(128deg,rgba(255,255,255,.22) 0 30%,transparent 30%),linear-gradient(232deg,rgba(255,255,255,.14) 0 40%,transparent 40%),linear-gradient(160deg,#66CCF5,#36AEE7)}
.r-hero .hero-ico{position:absolute;right:26px;top:24px;opacity:.95}
.kate-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(14,14,16,.82);color:#fff;border-radius:999px;padding:6px 11px 6px 7px;font-size:13.5px;font-weight:650}
.r-title{font-size:calc(24px * var(--fs));font-weight:700;line-height:1.2;margin-top:18px;letter-spacing:-.01em}
.r-body{font-size:calc(16px * var(--fs));line-height:1.5;color:#D8D8DE;margin-top:10px}
.r-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.r-fig{background:var(--card);border-radius:12px;padding:10px}
.r-fig b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.r-fig span{font-size:12px;color:var(--muted)}
.r-note{font-size:12px;color:var(--muted);margin-top:8px}
.r-prod{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:16px}
.r-prod-top{display:flex;justify-content:space-between;gap:10px;font-size:calc(15px * var(--fs))}
.r-prod-top span:last-child{color:var(--muted);white-space:nowrap}
.sri{display:flex;gap:5px;margin-top:12px}
.sri i{flex:1;height:28px;border-radius:7px;background:#2C2C31;display:grid;place-items:center;font-style:normal;font-size:12.5px;color:#7C7C86}
.sri i.fill{background:rgba(61,180,234,.22);color:#BDE6FA}
.sri i.cur{background:var(--kbc);color:#04263A;font-weight:750}
.sri-cap{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-top:9px;line-height:1.4}
.r-cta{display:block;width:100%;margin-top:18px;height:52px;border-radius:26px;background:var(--fab);color:#fff;font-weight:650;font-size:calc(16px * var(--fs));text-align:center}
.r-cta2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;height:50px;border-radius:25px;border:1px solid #3A3A40;color:#fff;font-weight:600;font-size:calc(15px * var(--fs))}
.r-sec{margin-top:28px}
.r-sec h2{font-size:calc(18px * var(--fs));font-weight:650;margin-bottom:10px}
.r-box{background:var(--card);border-radius:16px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;gap:14px;font-size:calc(13.5px * var(--fs));padding:10px 0;line-height:1.35;border-top:1px solid #2A2A2F}
.kv:first-child{border-top:0}
.kv > span:first-child{color:var(--muted);flex:0 0 auto}
.kv > span:last-child{text-align:right;font-weight:600}
.kv.new > span:last-child{color:#BDE6FA}
.tag{font-size:10.5px;font-weight:750;background:var(--kbc);color:#04263A;border-radius:5px;padding:1px 5px;margin-left:6px}
.bar{height:6px;border-radius:3px;background:#2C2C31;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kbc);border-radius:3px}
.meter{padding:10px 0;border-top:1px solid #2A2A2F}
.meter .kv{border:0;padding:0}
.reasons{list-style:none}
.reasons li{position:relative;padding:10px 0 10px 26px;font-size:calc(14.5px * var(--fs));line-height:1.45;border-top:1px solid #2A2A2F}
.reasons li:first-child{border-top:0}
.reasons li::before{content:"";position:absolute;left:4px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--kbc)}
.suit{display:flex;gap:10px;font-size:calc(13.5px * var(--fs));padding:10px 0;line-height:1.4;border-top:1px solid #2A2A2F}
.suit:first-child{border-top:0}
.suit .ok{color:var(--ok);font-weight:800}
.suit .no{color:var(--warn);font-weight:800}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0}
.toggle-row b{font-size:calc(15px * var(--fs));font-weight:600}
.toggle{width:50px;height:30px;border-radius:15px;background:#3A3A40;position:relative;transition:background .2s;flex:0 0 50px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-checked=true]{background:var(--ok)}
.toggle[aria-checked=true]::after{transform:translateX(20px)}
.fine{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.45;margin-top:12px}

/* pathways */
.pw{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:700;color:#111113;background:var(--pc);white-space:nowrap;line-height:1.2}
.pw b{width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.18);display:inline-grid;place-items:center;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.strip{display:flex;gap:5px;justify-content:center;margin-top:14px}
.strip i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;background:rgba(255,255,255,.07);color:#55555E}
.strip i.on{background:var(--pc);color:#111113}
.strip i.main{outline:2px solid #fff;outline-offset:2px}
.caption .strip,.caption .chips{justify-content:flex-start}
.cap-pw-t{margin-top:26px;color:#8E8E96;font-size:15px}
.pw-area{opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
.lock-col.shown .pw-area{opacity:1;transform:none}
.k-card .pw{margin:2px 0 7px}
.r-chip{margin-top:16px}
.r-chip + .r-title{margin-top:10px}
.r-keep{font-size:calc(12.5px * var(--fs));color:var(--muted);margin-top:12px;line-height:1.45;padding-top:10px;border-top:1px solid #2A2A2F}
.pw-row{display:flex;gap:12px;padding:11px 0;border-top:1px solid #2A2A2F;align-items:flex-start}
.pw-row:first-child{border-top:0}
.pw-n{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:grid;place-items:center;font-size:13px;font-weight:750;background:#2C2C31;color:#6E6E78}
.pw-row.on .pw-n,.pw-row.main .pw-n{background:var(--pc);color:#111113}
.pw-row.main .pw-n{outline:2px solid #fff;outline-offset:2px}
.pw-main{flex:1;min-width:0}
.pw-name{display:block;font-size:calc(14.5px * var(--fs));font-weight:650;color:#8A8A94}
.pw-row.on .pw-name,.pw-row.main .pw-name{color:#fff}
.pw-st{display:block;font-size:calc(12.5px * var(--fs));margin-top:2px;color:#7C7C86;line-height:1.4}
.pw-row.main .pw-st,.pw-row.on .pw-st{color:var(--pc);font-weight:650}
.pw-row.limit .pw-st{color:var(--warn)}
.pw-keep{display:block;font-size:calc(12px * var(--fs));color:var(--muted);margin-top:3px;line-height:1.4}

@media (max-width:1000px){.caption{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="controls" role="toolbar" aria-label="Demo controls">
  <div class="ctl-group"><span class="ctl-label">Stage</span>
    <button class="ctl" type="button" data-scene="0">1 Intro</button>
    <button class="ctl" type="button" data-scene="1">2 Notifications</button>
    <button class="ctl" type="button" data-scene="2">3 App</button>
    <button class="ctl" type="button" data-scene="3">4 Recommendation</button>
  </div>
  <div class="ctl-group" id="ctl-customers"><span class="ctl-label">Customer</span></div>
  <div class="ctl-group">
    <button class="ctl" type="button" id="btn-replay">Replay notifications</button>
    <button class="ctl" type="button" id="btn-personal" aria-pressed="true">Personalised</button>
  </div>
  <span class="ctl-hint">Arrows: stages. 1 to 4: customer. Enter: open. P: personalised. H: hide bar.</span>
</div>

<main id="stage">
  <!-- Stage 1: intro -->
  <section class="scene" id="scene-intro" aria-label="Intro">
    <div>
      <h1 class="big">Same bank. 2.3 million different customers.</h1>

function understand(c, s, trigger) {
  const surplus = s.income - s.expenses;
  const savingsRate = surplus / s.income;
  const buffer = s.savings / s.expenses;                 // months of spending covered
  const horizon = Math.max(1, 65 - c.age);               // years to retirement

  // Risk capacity (0-100): can this person absorb losses?
  const capacity = Math.round(100 * (
      0.35 * clamp(buffer / 6) +
      0.25 * clamp(s.incomeMonths / 24) +
      0.25 * clamp(horizon / 30) +
      0.15 * clamp(savingsRate / 0.25)));
  const capacityLevel = capacity < 35 ? 1 : capacity < 50 ? 2 : capacity < 65 ? 3 : capacity < 80 ? 4 : 5;

  // Risk limit = lower of what they want (questionnaire) and what they can bear (capacity)
  const maxSri = Math.min(s.questionnaire, capacityLevel) + 1;   // mapped to the 1-7 risk scale

  const knowledge = Math.min(100, s.knowledge * 25 + (s.readsMarketNews ? 15 : 0) + (s.invested > 0 ? 10 : 0));

  const ev = s.events;
  const lifeStage = c.age >= 58 ? "Pre-retirement"
    : ev.includes("child") ? "Young family"
    : (c.age < 28 && s.incomeMonths < 12) ? "Starter"
    : ev.includes("home") ? "Settling in" : "Building wealth";

  let tone, toneWhy;
  if (c.age >= 60 || s.prefersAdvisor) { tone = "formal"; toneWhy = "60+, prefers talking to an adviser"; }
  else if (knowledge >= 75 && s.readsMarketNews) { tone = "analytical"; toneWhy = "Experienced, reads market news"; }
  else if (ev.includes("child") || ev.includes("home")) { tone = "warm"; toneWhy = "Big home or family step"; }
  else { tone = "casual"; toneWhy = "Young, short and frequent app visits"; }

  const channel = s.prefersAdvisor ? "Notification, then adviser call" : "Notification and in-app card";
  const moment = EVENT_MOMENT[trigger] || `Around ${s.peakHour}, when they usually open the app`;

  return { surplus, savingsRate, buffer, horizon, capacity, maxSri, knowledge, lifeStage, tone, toneWhy, channel, moment };
}

function recommend(c, s, u) {
  const out = [], used = new Set();
  ACTIONS.filter(a => a.when(c, s, u)).sort((a, b) => b.score - a.score).forEach(a => {
    const p = PW[a.pathway];
    if (out.length >= 3 || used.has(p.key)) return;       // one suggestion per pathway, at most 3
    if (p.risk !== null && p.risk > u.maxSri) return;     // suitability gate
    used.add(p.key);
    const x = a.calc ? a.calc(c, s, u) : {};
    const copyFn = a.copy[u.tone] || Object.values(a.copy)[0];
    out.push({ action: a, p, x, copy: copyFn(c, s, u, p, x), reasons: a.reasons(c, s, u, p, x) });
  });
  return out;
}

// Why a pathway is NOT suggested right now, derived from the same signals.
function whyNot(p, c, s, u, recKeys) {
  if (p.risk !== null && p.risk > u.maxSri) {
    const extra = p.key === "realestate" && s.products.includes("Mortgage") ? ". Your home already gives you property exposure" : "";
    return { limit: true, text: `Above your risk limit of ${u.maxSri} of 7${extra}` };
  }
  switch (p.key) {
    case "cash": return { text: `Your savings already cover ${dec(u.buffer)} months of spending` };
    case "gov":
    case "corp":
      if (s.knowledge < 2) return { text: "Bolero bonds suit larger sums and some investing experience" };
      if (p.key === "corp" && recKeys.includes("gov")) return { text: "Government bonds cover this need with less issuer risk" };
      return { text: "Your goal is long-term growth rather than income" };
    case "equity": return { text: "Not a priority right now" };
    case "realestate": return { text: s.knowledge < 3 ? "Needs more investing experience" : "Not a priority right now" };
    case "homeins": return { text: s.products.includes("Home insurance") ? "Already covered by your KBC Home Insurance" : "No home of your own in your data yet" };
    case "loanins": return { text: s.products.includes("Mortgage") ? "Already covered" : "No mortgage in your data" };
    case "mortgage": return { text: s.products.includes("Mortgage") ? "You already have a KBC Mortgage Loan" : u.buffer < 3 ? "Safety net first; no home-buying signals yet" : "No home-buying signals in your data" };
  }
  return { text: "Not a priority right now" };
}

function pathwayStatus(c, s, u, recs) {
  const recKeys = recs.map(r => r.p.key);
  return PATHWAYS.map(p => {
    const i = recKeys.indexOf(p.key);
    if (i === 0) return { p, state: "main", text: "Recommended now" };
    if (i > 0) return { p, state: "on", text: "Also for you" };
    const w = whyNot(p, c, s, u, recKeys);
    return { p, state: w.limit ? "limit" : "off", text: w.text };
  });
}

/* =====================================================================
   4. USER INTERFACE
   ===================================================================== */

const state = { scene: 0, idx: 0, personal: true, pulse: false };
const $ = id => document.getElementById(id);
const phone = $("app-phone");
let notifTimers = [];

const model = i => {
  const c = CUSTOMERS[i];
  const s = c.event.apply(c.signals);

};

const pwChip = p => `<span class="pw" style="--pc:${p.color}"><b>${p.n}</b>${esc(p.name)}</span>`;

function playNotifications() {
  notifTimers.forEach(clearTimeout);
  notifTimers = [];
  const cols = document.querySelectorAll(".lock-col");
  cols.forEach(col => { col.classList.remove("shown"); col.querySelector(".notif").classList.remove("show"); });
  cols.forEach((col, i) => notifTimers.push(setTimeout(() => {
    col.querySelector(".notif").classList.add("show");
    col.classList.add("shown");
  }, 500 + i * 700)));
}

/* ---------- stages 3 and 4: the app ---------- */

    ${more}
    <div class="k-card"><span class="ico">${icon("mail", 26)}</span><span class="k-txt"><span class="k-lbl"><span class="kate-dot">${icon("spark", 11)}</span>Kate wants you to know</span><p>KBC will never ask for your card reader codes by phone, text or WhatsApp. If someone does, hang up.</p></span><span class="x" aria-hidden="true">✕</span></div>`;
}

function signalRows(c, s, u) {
  const yrs = s.incomeMonths >= 24 ? `${Math.floor(s.incomeMonths / 12)} years` : `${s.incomeMonths} months`;
  const rows = [
    ["Income", `${euros(s.income)} a month, steady for ${yrs}`],
    ["Spending", `${euros(s.expenses)} a month`],
    ["Savings", `${euros(s.savings)}, ${dec(u.buffer)} months of spending`],
    ["Investments", s.invested ? `${euros(s.invested)}, risk ${s.portfolioSri} of 7` : "None yet"],
    ["Products", s.products.filter(x => x !== "Current account").join(", ") || "Current account only"],
    ["App use", `${s.appSessionsWk} times a week, about ${s.avgSessionSec} s a visit`],
    ["Risk questionnaire", QLABEL[s.questionnaire]]
  ];
  if (s.readsMarketNews) rows.push(["Reading", "Market news, most mornings"]);
  if (s.prefersAdvisor) rows.push(["Contact preference", "Phone and branch"]);
  s.events.forEach(e => {
    const row = [EVENT_INFO[e].label, EVENT_INFO[e].detail, e === c.event.id];
    if (e === c.event.id) rows.unshift(row); else rows.push(row);
  });
  return rows.map(([k, v, n]) => `<div class="kv${n ? " new" : ""}"><span>${esc(k)}${n ? '<b class="tag">New</b>' : ""}</span><span>${esc(v)}</span></div>`).join("");
}

function pathwayListHTML(status) {
  return status.map(x => `<div class="pw-row ${x.state}" style="--pc:${x.p.color}">
      <span class="pw-n">${x.p.n}</span>
      <span class="pw-main"><span class="pw-name">${esc(x.p.name)}</span>
        <span class="pw-st">${esc(x.text)}</span>
        ${x.state === "main" || x.state === "on" ? `<span class="pw-keep">${esc(x.p.product)}. Keep in mind: ${esc(x.p.boundary)}</span>` : ""}
      </span></div>`).join("");
}

const toggleRow = () => `<div class="toggle-row"><b>Personalised suggestions</b><button class="toggle" type="button" role="switch" aria-checked="${state.personal}" aria-label="Personalised suggestions" data-act="personal"></button></div>`;

function recHTML(c, s, u, recs, status) {
  const head = `<div class="r-head"><button class="r-back" type="button" data-act="back" aria-label="Back">${icon("back", 22, 2)}</button><h1>For you</h1></div>`;
  if (!state.personal) {
    return `${head}
      <div class="r-title">Personalised suggestions are off</div>
      <p class="r-body">Everyone sees the same general offers, and your data is not used to choose them. You can switch this back on at any time.</p>
      <div class="r-sec"><div class="r-box">${toggleRow()}</div></div>`;
  }
  const r = recs[0], k = r.copy, p = r.p;
  const figs = k.figs ? `<div class="r-figs">${k.figs.map(f => `<div class="r-fig"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join("")}</div>` : "";
  const scale = p.risk
    ? `<div class="sri" aria-label="Indicative risk ${p.risk} of 7">${[1, 2, 3, 4, 5, 6, 7].map(n => `<i class="${n === p.risk ? "cur" : n <= u.maxSri ? "fill" : ""}">${n}</i>`).join("")}</div>
       <p class="sri-cap">Indicative risk ${p.risk} of 7. Highlighted: your personal limit, up to ${u.maxSri}.</p>`
    : `<p class="sri-cap">${esc(p.kind)}, no investment risk scale.</p>`;
  const portfolioFlag = s.portfolioSri > u.maxSri
    ? `<div class="kv"><span>Current investments</span><span style="color:var(--warn)">Risk ${s.portfolioSri} of 7, above your limit</span></div>` : "";

  return `${head}
    <div class="r-hero" style="--pc:${p.color}"><span class="hero-ico">${icon(r.action.icon || p.icon, 72, 1.4)}</span><span class="kate-pill"><span class="kate-dot">${icon("spark", 11)}</span>Kate, just for you</span></div>
    <div class="r-chip">${pwChip(p)}</div>
    <div class="r-title">${esc(k.title)}</div>
    <p class="r-body">${esc(k.body)}</p>
    ${figs}
    <div class="r-prod"><div class="r-prod-top"><span>${esc(p.product)}</span><span>${esc(p.kind)}</span></div>${scale}
      <p class="r-keep">Keep in mind: ${esc(p.boundary)}</p></div>
    <button class="r-cta" type="button">${esc(k.cta)}</button>
    <button class="r-cta2" type="button">${icon("spark", 14)} Ask Kate a question</button>

    <div class="r-sec"><h2>Your pathways</h2><p class="fine" style="margin:-4px 0 10px">Kate checks all 8 pathways against your situation and risk limit.</p>
      <div class="r-box">${pathwayListHTML(status)}</div></div>
    <div class="r-sec"><h2>Why Kate suggests this</h2><div class="r-box"><ul class="reasons">${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
    <div class="r-sec"><h2>What Kate noticed</h2><div class="r-box">${signalRows(c, s, u)}</div></div>
    <div class="r-sec"><h2>How this fits you</h2><div class="r-box">
      <div class="kv"><span>Life stage</span><span>${esc(u.lifeStage)}</span></div>
      <div class="meter"><div class="kv"><span>Risk capacity</span><span>${u.capacity} of 100</span></div><div class="bar"><i style="width:${Number(u.capacity)}%"></i></div></div>
      <div class="kv"><span>Risk limit</span><span>Up to ${u.maxSri} of 7</span></div>
      <div class="meter"><div class="kv"><span>Financial knowledge</span><span>${u.knowledge < 40 ? "Beginner" : u.knowledge < 70 ? "Some experience" : "Experienced"}</span></div><div class="bar"><i style="width:${Number(u.knowledge)}%"></i></div></div>
      ${portfolioFlag}
    </div><p class="fine">Your risk limit is the lower of your questionnaire answer and what your finances can absorb.</p></div>
    <div class="r-sec"><h2>You're in control</h2><div class="r-box">${toggleRow()}</div>
      <p class="fine">Kate only uses data you already share with KBC, with your consent. Before investing, read the key information document. The value of an investment can go down as well as up.</p></div>`;
}

function renderCaption(c, u, recs, status) {
  $("cap-step").textContent = `Customer ${state.idx + 1} of ${CUSTOMERS.length}`;
  $("cap-name").textContent = `${c.first}, ${c.age}`;
  $("cap-meta").textContent = `${c.city}. ${c.note}.`;
  const rows = state.personal
    ? [["Life stage", u.lifeStage], ["Voice", TONES[u.tone].label, u.toneWhy], ["Moment", u.moment], ["Risk limit", `Up to ${u.maxSri} of 7`]]
    : [["Life stage", "Not used"], ["Voice", "Same for everyone"], ["Moment", "Not timed"], ["Risk limit", "Not used"]];
  $("cap-dl").innerHTML = rows.map(([k, v, why]) => `<dt>${esc(k)}</dt><dd>${esc(v)}${why ? `<small>${esc(why)}</small>` : ""}</dd>`).join("");
  $("cap-pw").innerHTML = state.personal
    ? `<p class="cap-pw-t">Kate's pathways for ${esc(c.first)}</p>${stripHTML(status)}<div class="chips">${recs.map(r => pwChip(r.p)).join("")}</div>`
    : `<p class="cap-pw-t">Personalisation off: general offers only</p>`;
  const info = EVENT_INFO[c.event.id];
  $("cap-event").textContent = `Trigger: ${info.label.toLowerCase()}, ${info.detail.charAt(0).toLowerCase() + info.detail.slice(1)}`;
}

function renderApp() {
  const { c, s, u, recs, status } = model(state.idx);
  phone.dataset.size = u.tone === "formal" && state.personal ? "large" : "normal";
  phone.dataset.screen = state.scene === 3 ? "rec" : "home";
  $("st-time").textContent = c.lock.clock;
  $("home").innerHTML = homeHTML(c, s, u, recs);
  $("rec").innerHTML = recHTML(c, s, u, recs, status);
  renderCaption(c, u, recs, status);
  state.pulse = false;
}

function renderControls() {
  document.querySelectorAll("[data-scene]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.scene) === state.scene)));
  document.querySelectorAll("[data-cust]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.cust) === state.idx)));
  $("btn-personal").setAttribute("aria-pressed", String(state.personal));
}

/* ---------- navigation ---------- */
function setScene(i) {
  const prev = state.scene;
  state.scene = Math.max(0, Math.min(SCENES.length - 1, i));
  document.querySelectorAll(".scene").forEach(el => el.classList.toggle("active", el.id === SCENES[state.scene]));
  if (state.scene === 1) playNotifications();
  if (state.scene >= 2) {
    if (prev < 2) { $("home").scrollTop = 0; }
    if (state.scene === 3 && prev !== 3) $("rec").scrollTop = 0;
    renderApp();
  }
  renderControls();
}

function openCustomer(i, fromNotification) {
  state.idx = i;
  state.pulse = !!fromNotification;
  $("home").scrollTop = 0;
  $("rec").scrollTop = 0;
  setScene(state.scene >= 2 ? state.scene : 2);
}

function togglePersonal() { state.personal = !state.personal; if (state.scene >= 2) renderApp(); renderControls(); }

function fit() {
  const top = document.body.classList.contains("no-controls") ? 0 : 52;
  const H = window.innerHeight - top, W = window.innerWidth;
  document.documentElement.style.setProperty("--s", clamp((H - 56) / 844, 0.5, 1).toFixed(3));
  document.documentElement.style.setProperty("--s4", clamp(Math.min((H - 250) / 844, (W - 130 - 3 * 36) / (4 * 390)), 0.3, 1).toFixed(3));
}

/* ---------- wiring ---------- */
CUSTOMERS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "ctl"; b.type = "button"; b.dataset.cust = String(i);
  b.textContent = `${i + 1} ${c.first}`;
  b.addEventListener("click", () => openCustomer(i, state.scene < 2));
  $("ctl-customers").appendChild(b);
});
document.querySelectorAll("[data-scene]").forEach(b => b.addEventListener("click", () => setScene(Number(b.dataset.scene))));
$("btn-replay").addEventListener("click", () => { if (state.scene !== 1) setScene(1); else playNotifications(); });
$("btn-personal").addEventListener("click", togglePersonal);
$("scene-lock").addEventListener("click", e => {
  const n = e.target.closest("[data-open]");
  if (n) openCustomer(Number(n.dataset.open), true);
});
phone.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "open-rec") setScene(3);
  else if (a === "back") setScene(2);
  else if (a === "personal") togglePersonal();
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= String(CUSTOMERS.length)) openCustomer(Number(k) - 1, state.scene < 2);
  else if (k === "arrowright") setScene(state.scene + 1);
  else if (k === "arrowleft") setScene(state.scene - 1);
  else if (k === "enter" && state.scene === 2) setScene(3);
  else if ((k === "escape" || k === "backspace") && state.scene === 3) setScene(2);
  else if (k === "r") { if (state.scene !== 1) setScene(1); else playNotifications(); }
  else if (k === "p") togglePersonal();
  else if (k === "h") { document.body.classList.toggle("no-controls"); fit(); }
});
window.addEventListener("resize", fit);

$("st-icons").innerHTML = STATUS_ICONS;
$("fab").innerHTML = icon("swap", 28, 2);
$("k-nav").innerHTML = [["Start", "wallet", true], ["My KBC", "list"], ["Investments", "piggy"], ["Offer", "layers"]]
  .map(([t, ic, on]) => `<span class="${on ? "on" : ""}">${icon(ic, 22)}${esc(t)}</span>`).join("");
$("team-intro").textContent = `${TEAM_NAME}, Tectonic Hackathon 2026, KBC challenge`;
buildLockScreens();
fit();
renderApp();
setScene(0);
</script>
